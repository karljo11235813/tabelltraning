<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decimaltal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/decimaltal.css">
</head>
<body>

<header>
  <a class="header-title" href="index.html">Tabellträning</a>
</header>

<main>
  <div class="card">
    <a class="back-link" href="index.html">← Tillbaka</a>
    <div class="page-title-row">
      <img class="page-title-img" src="img/pages/decimaltal.png" alt="">
      <h2>Decimaltal</h2>
    </div>

    <section id="dtStart">
      <div class="dt-modes" role="group" aria-label="Läge">
        <button type="button" class="dt-mode" data-mode="practice" aria-pressed="true">
          <span class="dt-mode-name">Öva</span>
          <span class="dt-mode-desc">Ingen tid. Efter ett fel ser du steg för steg hur man tänker.</span>
        </button>
        <button type="button" class="dt-mode" data-mode="test" aria-pressed="false">
          <span class="dt-mode-name" id="dtTestName">Test</span>
          <span class="dt-mode-desc">Så många rätt du hinner. Varje fel drar av en poäng.</span>
          <span class="dt-mode-record" id="dtTestCard"></span>
        </button>
      </div>

      <h3 class="dt-cats-heading">Kategorier</h3>
      <div class="category-row" id="dtCategories"></div>
      <p class="dt-cats-note" id="dtCatsNote" hidden>Nivåerna och Dina framsteg gäller bara test med alla kategorier.</p>

      <div class="btn-row">
        <button type="button" id="dtStartBtn">Starta</button>
      </div>

      <section class="progress-panel" id="dtStartProgress" hidden></section>
    </section>

    <section id="dtPlay" hidden>
      <div class="dt-play-top">
        <div class="score-line" id="scoreLine"></div>
        <div class="dt-timer" id="dtTimer" hidden></div>
        <button type="button" class="dt-quit" id="dtQuit">Avsluta</button>
      </div>

      <div class="problem-box" id="problemBox">
        <div class="problem-label" id="problemLabel"></div>
        <div class="problem-text" id="problemText">–</div>
        <input type="text" inputmode="decimal" id="answerInput" autocomplete="off" aria-label="Svar">
        <div class="choice-answers" id="choiceAnswers" hidden>
          <button type="button" data-answer="större">Större</button>
          <button type="button" data-answer="mindre">Mindre</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="btn-row">
        <button type="button" id="actionBtn">Kontrollera</button>
      </div>
    </section>

    <section id="dtResult" hidden>
      <div id="dtResultBody"></div>
      <div class="btn-row">
        <button type="button" id="dtAgain">Kör igen</button>
        <button type="button" class="dt-secondary" id="dtBack">Tillbaka</button>
      </div>
      <section class="progress-panel" id="dtResultProgress" hidden></section>
    </section>

  </div>
</main>

<script type="module" src="js/decimaltal/app.js"></script>

</body>
</html>
