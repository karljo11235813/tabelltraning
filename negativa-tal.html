<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negativa tal — Övning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: #f3eef9;
    --surface: #ffffff;
    --accent: #7a4a8c;
    --accent-strong: #5f3870;
    --accent-soft: #ece0f5;
    --text: #221b28;
    --text-muted: #6f6478;
    --success: #2f8f6f;
    --success-soft: #e6f5ef;
    --danger: #b23b3b;
    --danger-soft: #fbecec;
    --border: #d8cfe0;
    --shadow: 0 2px 14px rgba(45, 24, 58, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1420;
      --surface: #251c2c;
      --accent: #c9a0dd;
      --accent-strong: #ddbaef;
      --accent-soft: #382a44;
      --text: #f0e9f5;
      --text-muted: #b7a9c2;
      --success: #5fcfa0;
      --success-soft: #203a30;
      --danger: #e2837f;
      --danger-soft: #402226;
      --border: #453a4f;
      --shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1420;
    --surface: #251c2c;
    --accent: #c9a0dd;
    --accent-strong: #ddbaef;
    --accent-soft: #382a44;
    --text: #f0e9f5;
    --text-muted: #b7a9c2;
    --success: #5fcfa0;
    --success-soft: #203a30;
    --danger: #e2837f;
    --danger-soft: #402226;
    --border: #453a4f;
    --shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    font-family: "Nunito Sans", "Segoe UI", "Arial", sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1, h2 { font-family: "Baloo 2", "Segoe UI", sans-serif; }
  header {
    width: 100%;
    background: var(--accent);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .header-title {
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 0.3px;
    background: none;
    border: none;
    color: inherit;
    padding: 0;
    cursor: pointer;
    text-decoration: none;
  }
  .header-title:hover { opacity: 0.85; }
  main {
    width: 100%;
    max-width: 560px;
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .card {
    background: var(--surface);
    border-radius: 12px;
    padding: 22px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    margin: 0 0 10px 0;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
  }
  a.back-link {
    color: var(--accent);
    font-family: "Nunito Sans", sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 16px;
  }

  .category-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 4px 0 22px;
  }
  .category-row button {
    padding: 8px 12px;
    border: 2px solid var(--accent);
    background: var(--surface);
    color: var(--accent);
    border-radius: 999px;
    font-family: "Nunito Sans", sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .category-row button.active {
    background: var(--accent);
    color: #fff;
  }
  .category-row button:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 2px;
  }

  .score-line {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }
  .score-line b { color: var(--text); }

  .problem-box {
    background: var(--surface);
    border-radius: 14px;
    padding: 32px 20px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 3px solid transparent;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 16px;
  }
  .problem-box.flash-correct { border-color: var(--success); background: var(--success-soft); }
  .problem-box.flash-wrong { border-color: var(--danger); background: var(--danger-soft); }

  .problem-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .problem-text {
    font-family: "Baloo 2", sans-serif;
    font-size: 1.9rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 18px;
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
  }
  .problem-text sup {
    font-size: 0.6em;
    top: -0.6em;
  }
  #answerInput {
    width: 150px;
    font-family: "Baloo 2", sans-serif;
    font-size: 1.7rem;
    text-align: center;
    padding: 10px;
    border: 2px solid var(--accent);
    border-radius: 9px;
    outline: none;
    background: var(--surface);
    color: var(--text);
  }
  #answerInput:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 2px;
  }
  .feedback {
    min-height: 1.3em;
    margin-top: 14px;
    font-size: 0.95rem;
    font-weight: 700;
  }
  .feedback.correct { color: var(--success); }
  .feedback.wrong { color: var(--danger); }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    justify-content: center;
  }
  .btn-row button {
    min-width: 130px;
    padding: 12px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-family: "Baloo 2", sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-row button:hover { background: var(--accent-strong); }
  .btn-row button:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 2px;
  }
  .btn-row button.secondary {
    background: var(--surface);
    color: var(--accent);
    border: 2px solid var(--accent);
  }

  .hint {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <a class="header-title" href="index.html">Tabellträning</a>
</header>

<main>
  <div class="card">
    <a class="back-link" href="index.html">← Tillbaka</a>
    <h2>Negativa tal — övning</h2>

    <div class="category-row" id="categoryRow">
      <button type="button" data-cat="mixed" class="active">Blandat</button>
      <button type="button" data-cat="addsub">Addition/subtraktion</button>
      <button type="button" data-cat="muldiv">Multiplikation/division</button>
      <button type="button" data-cat="combined">Kombinerade uttryck</button>
      <button type="button" data-cat="powers">Potenser</button>
      <button type="button" data-cat="variables">Uttryck med variabler</button>
      <button type="button" data-cat="equations">Ekvationer</button>
    </div>

    <div class="score-line" id="scoreLine">Rätt: <b id="scoreCorrect">0</b> av <b id="scoreTotal">0</b></div>

    <div class="problem-box" id="problemBox">
      <div class="problem-label" id="problemLabel"></div>
      <div class="problem-text" id="problemText">–</div>
      <input type="text" inputmode="numeric" id="answerInput" autocomplete="off" aria-label="Svar">
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="btn-row">
      <button type="button" id="checkBtn">Kontrollera</button>
      <button type="button" class="secondary" id="nextBtn">Nästa</button>
    </div>

    <div class="hint">Skriv ditt svar och tryck Enter, eller klicka Kontrollera. Vid ekvationer: skriv bara värdet av x.</div>
  </div>
</main>

<script>
(function () {
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function randNonZero(min, max) {
    let n;
    do { n = randInt(min, max); } while (n === 0);
    return n;
  }
  // Excludes ±1 too — a coefficient of 1 reads oddly ("1x = 8").
  function randCoefficient(min, max) {
    let n;
    do { n = randInt(min, max); } while (n === 0 || Math.abs(n) === 1);
    return n;
  }
  // Plain signed display: "−6" or "6" — used for a leading term.
  function num(n) {
    return n < 0 ? '−' + (-n) : String(n);
  }
  // Wraps a negative operand in parens so it reads unambiguously after
  // an operator: "6 + (−2)", "(−3) · 4". Positive operands are bare.
  function op(n) {
    return n < 0 ? '(−' + (-n) + ')' : String(n);
  }
  function pow(base, exp) {
    return Math.pow(base, exp);
  }

  // Each generator returns { label, text, answer }. `text` is HTML
  // (so exponents can use <sup>); `answer` is the integer the input
  // must match exactly.

  function genAddSub() {
    const variant = randInt(1, 8);
    const a = randInt(2, 15), b = randInt(2, 15), c = randInt(2, 15), d = randInt(2, 15);
    switch (variant) {
      case 1: return { text: `${a} − ${b} =`, answer: a - b };
      case 2: return { text: `−${a} − ${b} =`, answer: -a - b };
      case 3: return { text: `${a} + (−${b}) =`, answer: a - b };
      case 4: return { text: `(−${a}) + ${b} =`, answer: b - a };
      case 5: return { text: `(−${a}) + (−${b}) =`, answer: -a - b };
      case 6: return { text: `${a} − ${b} + ${c} − ${d} =`, answer: a - b + c - d };
      case 7: return { text: `−${a} − (−${b}) =`, answer: -a + b };
      default: return { text: `${a} − (${b} − ${c}) =`, answer: a - b + c };
    }
  }

  function genMulDiv() {
    const variant = randInt(1, 8);
    const a = randNonZero(2, 12), b = randNonZero(2, 12), c = randNonZero(2, 9);
    switch (variant) {
      case 1: return { text: `${a} · ${b} =`, answer: a * b };
      case 2: return { text: `(−${a}) · ${b} =`, answer: -a * b };
      case 3: return { text: `(−${a}) · (−${b}) =`, answer: a * b };
      case 4: return { text: `${a} · (−${b}) · (−${c}) =`, answer: a * b * c };
      case 5: {
        const quotient = randNonZero(2, 12);
        const dividend = a * quotient;
        return { text: `${dividend} / ${a} =`, answer: quotient };
      }
      case 6: {
        const quotient = randNonZero(2, 12);
        const dividend = a * quotient;
        return { text: `(−${dividend}) / (−${a}) =`, answer: quotient };
      }
      case 7: {
        const quotient = randNonZero(2, 12);
        const dividend = a * quotient;
        return { text: `(−${dividend}) / ${a} =`, answer: -quotient };
      }
      default: return { text: `(${a} − ${b}) · (${b} − ${a}) =`, answer: (a - b) * (b - a) };
    }
  }

  function genCombined() {
    const variant = randInt(1, 4);
    const a = randNonZero(2, 9), b = randInt(2, 12), c = randInt(2, 12);
    switch (variant) {
      case 1: return { text: `${a} · (−${b}) − ${c} =`, answer: a * -b - c };
      case 2: return { text: `${a} · (−${b} − ${c}) =`, answer: a * (-b - c) };
      case 3: return { text: `${a} · (−${b} − (−${c})) =`, answer: a * (-b + c) };
      default: return { text: `(−${a}) · (${b} − (−${c})) =`, answer: -a * (b + c) };
    }
  }

  function genPowers() {
    const variant = randInt(1, 3);
    const a = randInt(2, 6);
    switch (variant) {
      case 1: return { text: `(−${a})<sup>2</sup> =`, answer: pow(-a, 2) };
      case 2: return { text: `(−${a})<sup>3</sup> =`, answer: pow(-a, 3) };
      default: {
        const b = randInt(2, 5);
        return { text: `(−${a})<sup>2</sup> + (−${b})<sup>3</sup> =`, answer: pow(-a, 2) + pow(-b, 3) };
      }
    }
  }

  function genVariables() {
    const variant = randInt(1, 6);
    const x = randNonZero(-9, 9);
    const y = randNonZero(-9, 9);
    const label = `Om x = ${num(x)} och y = ${num(y)}:`;
    switch (variant) {
      case 1: return { label, text: 'x + y =', answer: x + y };
      case 2: return { label, text: 'x − y =', answer: x - y };
      case 3: return { label, text: '−x + y =', answer: -x + y };
      case 4: return { label, text: '7 − 2x =', answer: 7 - 2 * x };
      case 5: return { label, text: '7 − 2xy =', answer: 7 - 2 * x * y };
      default: return { label, text: '4x − xy =', answer: 4 * x - x * y };
    }
  }

  function genEquations() {
    const variant = randInt(1, 5);
    const x = randNonZero(-12, 12);
    const label = 'Lös ekvationen — vad är x?';
    switch (variant) {
      case 1: {
        const a = randInt(2, 15);
        return { label, text: `${a} + x = ${a + x} `, answer: x };
      }
      case 2: {
        const a = randInt(2, 15);
        return { label, text: `${a} − x = ${a - x} `, answer: x };
      }
      case 3: {
        const c = randCoefficient(-9, 9);
        return { label, text: `${op(c)}x = ${c * x} `, answer: x };
      }
      case 4: {
        const c = randCoefficient(-9, 9);
        const a = randInt(2, 12);
        return { label, text: `${op(c)} · (${a} − x) = ${c * (a - x)} `, answer: x };
      }
      default: {
        const c = randCoefficient(-9, 9);
        const a = randInt(-12, -2);
        return { label, text: `(${num(a)} − x) · ${op(c)} = ${c * (a - x)} `, answer: x };
      }
    }
  }

  const GENERATORS = {
    addsub: genAddSub,
    muldiv: genMulDiv,
    combined: genCombined,
    powers: genPowers,
    variables: genVariables,
    equations: genEquations,
  };
  const CATEGORY_KEYS = Object.keys(GENERATORS);

  let currentCategory = 'mixed';
  let current = null;
  let correctCount = 0;
  let totalCount = 0;
  let awaitingNext = false;

  const categoryRow = document.getElementById('categoryRow');
  const scoreCorrect = document.getElementById('scoreCorrect');
  const scoreTotal = document.getElementById('scoreTotal');
  const problemBox = document.getElementById('problemBox');
  const problemLabel = document.getElementById('problemLabel');
  const problemText = document.getElementById('problemText');
  const answerInput = document.getElementById('answerInput');
  const feedback = document.getElementById('feedback');
  const checkBtn = document.getElementById('checkBtn');
  const nextBtn = document.getElementById('nextBtn');

  function pickGenerator() {
    const key = currentCategory === 'mixed'
      ? CATEGORY_KEYS[randInt(0, CATEGORY_KEYS.length - 1)]
      : currentCategory;
    return GENERATORS[key]();
  }

  function newProblem() {
    current = pickGenerator();
    problemLabel.textContent = current.label || '';
    problemLabel.style.display = current.label ? 'block' : 'none';
    problemText.innerHTML = current.text;
    answerInput.value = '';
    feedback.textContent = '';
    feedback.className = 'feedback';
    problemBox.classList.remove('flash-correct', 'flash-wrong');
    awaitingNext = false;
    answerInput.focus();
  }

  function checkAnswer() {
    if (awaitingNext) {
      newProblem();
      return;
    }
    const raw = answerInput.value.trim().replace(/\s+/g, '');
    if (raw === '') return;
    const given = parseInt(raw, 10);
    const isCorrect = given === current.answer;

    totalCount++;
    if (isCorrect) correctCount++;
    scoreCorrect.textContent = correctCount;
    scoreTotal.textContent = totalCount;

    problemBox.classList.remove('flash-correct', 'flash-wrong');
    void problemBox.offsetWidth;
    if (isCorrect) {
      problemBox.classList.add('flash-correct');
      feedback.textContent = 'Rätt!';
      feedback.className = 'feedback correct';
    } else {
      problemBox.classList.add('flash-wrong');
      feedback.textContent = 'Fel — rätt svar är ' + current.answer + '.';
      feedback.className = 'feedback wrong';
    }
    awaitingNext = true;
  }

  categoryRow.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-cat]');
    if (!btn) return;
    currentCategory = btn.dataset.cat;
    categoryRow.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    newProblem();
  });

  checkBtn.addEventListener('click', checkAnswer);
  nextBtn.addEventListener('click', newProblem);

  answerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.repeat) {
      e.preventDefault();
      checkAnswer();
    }
  });

  newProblem();
})();
</script>

</body>
</html>
