<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabellträning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: #f3eef9;
    --surface: #ffffff;
    --accent: #7a4a8c;
    --accent-strong: #5f3870;
    --accent-soft: #ece0f5;
    --text: #221b28;
    --text-muted: #6f6478;
    --success: #2f8f6f;
    --success-soft: #e6f5ef;
    --danger: #b23b3b;
    --danger-soft: #fbecec;
    --border: #d8cfe0;
    --shadow: 0 2px 14px rgba(45, 24, 58, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1420;
      --surface: #251c2c;
      --accent: #c9a0dd;
      --accent-strong: #ddbaef;
      --accent-soft: #382a44;
      --text: #f0e9f5;
      --text-muted: #b7a9c2;
      --success: #5fcfa0;
      --success-soft: #203a30;
      --danger: #e2837f;
      --danger-soft: #402226;
      --border: #453a4f;
      --shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1420;
    --surface: #251c2c;
    --accent: #c9a0dd;
    --accent-strong: #ddbaef;
    --accent-soft: #382a44;
    --text: #f0e9f5;
    --text-muted: #b7a9c2;
    --success: #5fcfa0;
    --success-soft: #203a30;
    --danger: #e2837f;
    --danger-soft: #402226;
    --border: #453a4f;
    --shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    font-family: "Nunito Sans", "Segoe UI", "Arial", sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1, h2, .display-num {
    font-family: "Baloo 2", "Segoe UI", sans-serif;
  }
  header {
    width: 100%;
    background: var(--accent);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .header-title {
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 0.3px;
    background: none;
    border: none;
    color: inherit;
    padding: 0;
    cursor: pointer;
  }
  .header-title:hover { opacity: 0.85; }
  .header-title:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }
  .lang-toggle {
    flex-shrink: 0;
    display: flex;
    border: 1.5px solid rgba(255,255,255,0.6);
    border-radius: 8px;
    overflow: hidden;
  }
  .lang-toggle button {
    font-family: "Nunito Sans", sans-serif;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.4px;
    padding: 6px 10px;
    background: transparent;
    color: #fff;
    border: none;
    cursor: pointer;
  }
  .lang-toggle button.active {
    background: #fff;
    color: var(--accent);
  }
  .lang-toggle button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: -2px;
  }
  main {
    width: 100%;
    max-width: 560px;
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  /* ---------- SHARED CARD ---------- */
  .card {
    background: var(--surface);
    border-radius: 12px;
    padding: 22px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    margin: 0 0 10px 0;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
  }
  .card h2:not(:first-child) { margin-top: 22px; }

  .back-link {
    background: none;
    border: none;
    color: var(--accent);
    font-family: "Nunito Sans", sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0 0 16px 0;
    display: inline-block;
  }

  /* ---------- LANDING SCREEN ---------- */
  .landing-choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 6px;
  }
  .landing-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding: 20px;
    border: 2px solid var(--accent);
    border-radius: 12px;
    background: var(--surface);
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
  }
  .landing-card:hover { background: var(--accent-soft); }
  .landing-card:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 2px;
  }
  .landing-card-title {
    font-family: "Baloo 2", sans-serif;
    font-weight: 800;
    font-size: 1.3rem;
    color: var(--accent);
  }
  .landing-card-desc {
    font-family: "Nunito Sans", sans-serif;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .choice-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .choice-row button {
    flex: 1;
    min-width: 0;
    padding: 12px 6px;
    border: 2px solid var(--accent);
    background: var(--surface);
    color: var(--accent);
    border-radius: 9px;
    font-family: "Nunito Sans", sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .choice-row button:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 2px;
  }
  .choice-row button.active {
    background: var(--accent);
    color: #fff;
  }
  .choice-sub {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin: 6px 2px 0;
  }

  .table-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-top: 4px;
  }
  .table-grid label {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 0;
    border: 2px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    color: var(--text);
    user-select: none;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .table-grid input { position: absolute; opacity: 0; width: 0; height: 0; }
  .table-grid label.checked {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .table-grid label:has(input:focus-visible) {
    outline: 3px solid var(--accent-strong);
    outline-offset: 1px;
  }

  .quick-select {
    display: flex;
    gap: 14px;
    margin-top: 10px;
  }
  .quick-select button {
    background: none;
    border: none;
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
    font-family: "Nunito Sans", sans-serif;
    font-size: 0.85rem;
    padding: 4px 0;
  }
  .start-btn {
    width: 100%;
    margin-top: 24px;
    padding: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-family: "Baloo 2", sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
  }
  .start-btn:hover:not(:disabled) { background: var(--accent-strong); }
  .start-btn:disabled {
    background: var(--border);
    cursor: not-allowed;
  }
  .hint {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 10px;
    text-align: center;
  }

  /* ---------- TEST SCREEN (running) ---------- */
  #testScreen { display: none; flex-direction: column; align-items: stretch; }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .timer {
    font-family: "Baloo 2", sans-serif;
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .live-score {
    font-size: 1.05rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .live-score b { color: var(--success); font-family: "Baloo 2", sans-serif; }

  .timer-bar-track {
    width: 100%;
    height: 8px;
    background: var(--accent-soft);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .timer-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s linear;
  }

  .problem-box {
    background: var(--surface);
    border-radius: 14px;
    padding: 36px 20px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 3px solid transparent;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 16px;
  }
  .problem-box.flash-correct { border-color: var(--success); background: var(--success-soft); }
  .problem-box.flash-wrong { border-color: var(--danger); background: var(--danger-soft); }

  .problem-text {
    font-family: "Baloo 2", sans-serif;
    font-size: 2.7rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 18px;
    font-variant-numeric: tabular-nums;
  }
  #answerInput {
    width: 150px;
    font-family: "Baloo 2", sans-serif;
    font-size: 2rem;
    text-align: center;
    padding: 10px;
    border: 2px solid var(--accent);
    border-radius: 9px;
    outline: none;
    background: var(--surface);
    color: var(--text);
  }
  #answerInput:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 2px;
  }

  .preview-box {
    background: var(--accent-soft);
    border: 1.5px dashed var(--accent);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.95rem;
    color: var(--text-muted);
  }
  .preview-box .preview-title {
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 6px;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .preview-box .preview-item {
    font-family: "Baloo 2", sans-serif;
    font-size: 1.2rem;
    color: var(--text);
    margin: 3px 0;
    font-variant-numeric: tabular-nums;
  }
  .preview-box .preview-item span.lbl {
    font-family: "Nunito Sans", sans-serif;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-right: 6px;
  }

  /* ---------- RESULT SCREEN ---------- */
  #resultScreen { display: none; }
  .result-card {
    background: var(--surface);
    border-radius: 12px;
    padding: 32px 22px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .result-card h2 { color: var(--accent); margin: 0 0 4px 0; font-size: 1.3rem; }
  .result-number {
    font-family: "Baloo 2", sans-serif;
    font-size: 3.4rem;
    font-weight: 800;
    color: var(--success);
    margin: 8px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .result-caption {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-bottom: 18px;
  }
  .rank-ladder {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
    margin: 4px 0 24px;
  }
  .rank-marker {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 2px 0;
  }
  .rank-marker-line {
    flex: 1;
    height: 0;
    border-top: 2px dashed var(--success);
  }
  .rank-marker-label {
    font-family: "Nunito Sans", sans-serif;
    font-size: 0.66rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--success);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .rank-tier {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
  }
  .rank-tier .tier-step {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: "Baloo 2", sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--accent-soft);
    font-variant-numeric: tabular-nums;
  }
  .rank-tier .tier-body { flex: 1; min-width: 0; }
  .rank-tier .tier-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .rank-tier .tier-name {
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--text);
  }
  .rank-tier .tier-range {
    font-size: 0.72rem;
    color: var(--text-muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .rank-tier .tier-desc {
    font-size: 0.76rem;
    color: var(--text-muted);
    margin-top: 1px;
  }
  .rank-tier.achieved {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .rank-tier.achieved .tier-step {
    background: var(--accent);
    color: #fff;
  }
  .rank-tier.achieved .tier-name { color: var(--accent-strong); }
  .rank-tier .tier-you {
    flex-shrink: 0;
    font-family: "Nunito Sans", sans-serif;
    font-size: 0.66rem;
    font-weight: 800;
    color: #fff;
    background: var(--accent);
    padding: 2px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .result-stats {
    display: flex;
    justify-content: center;
    gap: 26px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }
  .result-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .result-stat .val {
    font-family: "Baloo 2", sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .result-stat .lbl {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: 2px;
  }
  .again-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-family: "Baloo 2", sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .again-btn:hover { background: var(--accent-strong); }

  @media (max-width: 420px) {
    .table-grid { grid-template-columns: repeat(4, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    .timer-bar-fill, .problem-box, .choice-row button, .start-btn, .again-btn, .landing-card { transition: none; }
  }
</style>
</head>
<body>

<header>
  <button type="button" class="header-title" id="headerTitle">Tabellträning</button>
  <div class="lang-toggle" id="langToggle">
    <button type="button" data-lang="sv" class="active">SV</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main>

  <!-- LANDING -->
  <div id="landingScreen" class="card">
    <h2 id="landingHeading">Vad vill du göra?</h2>
    <div class="landing-choices">
      <button type="button" class="landing-card" id="chooseTestBtn">
        <span class="landing-card-title" id="landingTestTitle">Test</span>
        <span class="landing-card-desc" id="landingTestDesc">Utvärdera dig själv — alla tabeller, multiplikation och division.</span>
      </button>
      <button type="button" class="landing-card" id="choosePracticeBtn">
        <span class="landing-card-title" id="landingPracticeTitle">Öva</span>
        <span class="landing-card-desc" id="landingPracticeDesc">Träna fritt — välj tabeller och räknesätt själv.</span>
      </button>
    </div>
  </div>

  <!-- TEST SETUP (fixed scope) -->
  <div id="testSetupScreen" class="card" style="display:none;">
    <button type="button" class="back-link" id="backFromTest">← Tillbaka</button>
    <h2 id="testSetupHeading">Test</h2>
    <div class="choice-sub" id="testSetupInfo">Alla tabeller (1–12), multiplikation och division blandat.</div>
    <div class="choice-row" id="testModeChoice" style="margin-top: 14px;">
      <button type="button" data-mode="time" class="active"></button>
      <button type="button" data-mode="count"></button>
    </div>
    <button class="start-btn" id="testStartBtn"></button>
    <div class="hint" id="testStartHint"></div>
  </div>

  <!-- PRACTICE SETUP (detailed) -->
  <div id="setupScreen" class="card" style="display:none;">
    <button type="button" class="back-link" id="backFromPractice">← Tillbaka</button>

    <h2 id="labelChooseMode">Välj läge</h2>
    <div class="choice-row" id="modeChoice">
      <button type="button" data-mode="time" class="active"></button>
      <button type="button" data-mode="count"></button>
    </div>
    <div class="choice-sub" id="modeSub"></div>

    <h2 id="labelChooseOp">Välj räknesätt</h2>
    <div class="choice-row" id="opChoice">
      <button type="button" data-op="mul" class="active"></button>
      <button type="button" data-op="div"></button>
      <button type="button" data-op="mix"></button>
    </div>

    <h2 id="labelChooseTables">Välj tabeller</h2>
    <div class="table-grid" id="tableGrid"></div>
    <div class="quick-select">
      <button type="button" id="selectAll"></button>
      <button type="button" id="selectNone"></button>
    </div>

    <button class="start-btn" id="startBtn"></button>
    <div class="hint" id="startHint"></div>
  </div>

  <!-- RUNNING TEST/PRACTICE -->
  <div id="testScreen">
    <div class="top-row">
      <div class="timer" id="timerDisplay">60</div>
      <div class="live-score" id="liveScoreLabel">Rätt: <b id="liveScore">0</b></div>
    </div>
    <div class="timer-bar-track"><div class="timer-bar-fill" id="timerBar"></div></div>

    <div class="problem-box" id="problemBox">
      <div class="problem-text" id="problemText">–</div>
      <input type="tel" inputmode="numeric" id="answerInput" autocomplete="off">
    </div>

    <div class="preview-box">
      <div class="preview-title" id="previewTitle">Kommande frågor</div>
      <div class="preview-item"><span class="lbl" id="previewNextLbl">Nästa:</span><span id="preview1"></span></div>
      <div class="preview-item"><span class="lbl" id="previewThenLbl">Därefter:</span><span id="preview2"></span></div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="resultScreen">
    <div class="result-card">
      <h2 id="resultTitle">Tiden är ute!</h2>
      <div class="result-number" id="resultHeadline">0</div>
      <div class="result-caption" id="resultCaption">rätta svar på 1 minut</div>
      <div class="rank-ladder" id="rankLadder"></div>
      <div class="result-stats">
        <div class="result-stat"><div class="val" id="statCorrect">0</div><div class="lbl" id="lblStatCorrect">Rätt</div></div>
        <div class="result-stat"><div class="val" id="statWrong">0</div><div class="lbl" id="lblStatWrong">Fel</div></div>
        <div class="result-stat"><div class="val" id="statSpeed">0,0 s</div><div class="lbl" id="lblStatSpeed">Snitt/fråga</div></div>
      </div>
      <button class="again-btn" id="againBtn">Kör igen</button>
    </div>
  </div>

</main>

<script>
(function () {
  const ROUND_SECONDS = 60;
  const COUNT_TARGET = 100;
  const MAX_TABLE = 12;
  const ACCEPTABLE_THRESHOLD = 2; // seconds/question — green cutoff & ladder marker
  const BG_WORST_AT = 8; // seconds/question — fully orange beyond this

  // ---------- Translations ----------
  const I18N = {
    sv: {
      title: 'Tabellträning',
      landingHeading: 'Vad vill du göra?',
      testTitle: 'Test',
      testDesc: 'Utvärdera dig själv — alla tabeller, multiplikation och division.',
      practiceTitle: 'Öva',
      practiceDesc: 'Träna fritt — välj tabeller och räknesätt själv.',
      back: '← Tillbaka',
      testInfo: 'Alla tabeller (1–12), multiplikation och division blandat.',
      chooseMode: 'Välj läge',
      mode1min: '1 minut',
      mode100: '100 frågor',
      modeSubTime: 'Svara på så många som möjligt innan tiden tar slut.',
      modeSubCount: 'Svara på 100 frågor så snabbt du kan.',
      chooseOp: 'Välj räknesätt',
      opMul: 'Multiplikation',
      opDiv: 'Division',
      opMix: 'Blandat',
      chooseTables: 'Välj tabeller',
      selectAll: 'Välj alla',
      selectNone: 'Välj inga',
      startTime: 'Starta 1-minuterstest',
      startCount: 'Starta 100-frågorstest',
      hintTime: 'Du har 60 sekunder på dig. Svara med siffror och tryck Enter.',
      hintCount: '100 frågor väntar. Svara med siffror och tryck Enter.',
      liveCorrect: 'Rätt: ',
      liveQuestion: 'Fråga ',
      previewTitle: 'Kommande frågor',
      previewNext: 'Nästa:',
      previewThen: 'Därefter:',
      answerAria: 'Svar',
      resultTitleTime: 'Tiden är ute!',
      resultTitleCount: 'Klart!',
      resultCaptionTime: 'rätta svar på 1 minut',
      resultCaptionCount: 'för 100 frågor',
      statCorrect: 'Rätt',
      statWrong: 'Fel',
      statSpeed: 'Snitt/fråga',
      again: 'Kör igen',
      tierYou: 'DU',
      acceptableLabel: 'Godkänd nivå',
      tiers: [
        { max: 1,        label: 'Matematikguden',    range: '≤ 1 sekund',    desc: 'Svaret finns innan frågan ens hunnit visas färdigt.' },

        { max: 5,        label: 'Snabbtänkaren',     range: '≤ 5 sekunder',  desc: 'Ser mönstret och svarar utan att tveka.' },

        { max: Infinity, label: 'Fingerräknaren',    range: '> 10 sekunder', desc: 'Räknar på fingrarna. Alla måste börja någonstans!' },
      ],
    },
    en: {
      title: 'Times Tables Trainer',
      landingHeading: 'What would you like to do?',
      testTitle: 'Test',
      testDesc: 'Evaluate yourself — all tables, multiplication and division.',
      practiceTitle: 'Practice',
      practiceDesc: 'Train freely — choose your own tables and operation.',
      back: '← Back',
      testInfo: 'All tables (1–12), multiplication and division mixed.',
      chooseMode: 'Choose mode',
      mode1min: '1 minute',
      mode100: '100 questions',
      modeSubTime: 'Answer as many as you can before time runs out.',
      modeSubCount: 'Answer 100 questions as fast as you can.',
      chooseOp: 'Choose operation',
      opMul: 'Multiplication',
      opDiv: 'Division',
      opMix: 'Mixed',
      chooseTables: 'Choose tables',
      selectAll: 'Select all',
      selectNone: 'Select none',
      startTime: 'Start 1-minute test',
      startCount: 'Start 100-question test',
      hintTime: 'You have 60 seconds. Answer with digits and press Enter.',
      hintCount: '100 questions await. Answer with digits and press Enter.',
      liveCorrect: 'Correct: ',
      liveQuestion: 'Question ',
      previewTitle: 'Coming up',
      previewNext: 'Next:',
      previewThen: 'Then:',
      answerAria: 'Answer',
      resultTitleTime: "Time's up!",
      resultTitleCount: 'Done!',
      resultCaptionTime: 'correct answers in 1 minute',
      resultCaptionCount: 'for 100 questions',
      statCorrect: 'Correct',
      statWrong: 'Wrong',
      statSpeed: 'Avg/question',
      again: 'Try again',
      tierYou: 'YOU',
      acceptableLabel: 'Acceptable level',
      tiers: [
        { max: 1,        label: 'The Math God',              range: '≤ 1 second',    desc: 'The answer exists before the question has even finished appearing.' },
        { max: 2,        label: 'The Supercomputer',         range: '≤ 2 seconds',   desc: 'Computes faster than you can think.' },
        { max: 3,        label: 'Calculator 2.0',            range: '≤ 3 seconds',   desc: 'As fast as a calculator — the ultimate goal!' },
        { max: 4,        label: 'The Math Machine',          range: '≤ 4 seconds',   desc: 'Runs like clockwork, barely any delay.' },
        { max: 5,        label: 'The Quick Thinker',         range: '≤ 5 seconds',   desc: 'Spots the pattern and answers without hesitating.' },
        { max: 6,        label: 'The Seasoned Calculator',   range: '≤ 6 seconds',   desc: 'Practice makes perfect — answers come quicker and quicker.' },
        { max: 10,       label: 'The Mental Mathematician',  range: '7–10 seconds',  desc: 'Does it in their head, but needs a moment to think.' },
        { max: Infinity, label: 'The Finger Counter',        range: '> 10 seconds',  desc: 'Counts on fingers. Everyone starts somewhere!' },
      ],
    },
  };

  let lang = 'sv';
  try {
    const saved = localStorage.getItem('tabelltraning_lang');
    if (saved === 'sv' || saved === 'en') lang = saved;
  } catch (e) { /* localStorage unavailable — fall back to default */ }

  function t() { return I18N[lang]; }

  const landingScreen = document.getElementById('landingScreen');
  const testSetupScreen = document.getElementById('testSetupScreen');
  const setupScreen = document.getElementById('setupScreen');
  const testScreen = document.getElementById('testScreen');
  const resultScreen = document.getElementById('resultScreen');

  const headerTitle = document.getElementById('headerTitle');
  const langToggle = document.getElementById('langToggle');

  const chooseTestBtn = document.getElementById('chooseTestBtn');
  const choosePracticeBtn = document.getElementById('choosePracticeBtn');
  const backFromTest = document.getElementById('backFromTest');
  const backFromPractice = document.getElementById('backFromPractice');

  const testModeButtons = document.querySelectorAll('#testModeChoice button');
  const testStartBtn = document.getElementById('testStartBtn');
  const testStartHint = document.getElementById('testStartHint');

  const tableGrid = document.getElementById('tableGrid');
  const modeButtons = document.querySelectorAll('#modeChoice button');
  const modeSub = document.getElementById('modeSub');
  const opButtons = document.querySelectorAll('#opChoice button');
  const startBtn = document.getElementById('startBtn');
  const startHint = document.getElementById('startHint');
  const selectAllBtn = document.getElementById('selectAll');
  const selectNoneBtn = document.getElementById('selectNone');

  const timerDisplay = document.getElementById('timerDisplay');
  const timerBar = document.getElementById('timerBar');
  const liveScoreLabel = document.getElementById('liveScoreLabel');
  const problemBox = document.getElementById('problemBox');
  const problemText = document.getElementById('problemText');
  const answerInput = document.getElementById('answerInput');
  const preview1 = document.getElementById('preview1');
  const preview2 = document.getElementById('preview2');

  const resultTitle = document.getElementById('resultTitle');
  const resultHeadline = document.getElementById('resultHeadline');
  const resultCaption = document.getElementById('resultCaption');
  const statCorrect = document.getElementById('statCorrect');
  const statWrong = document.getElementById('statWrong');
  const statSpeed = document.getElementById('statSpeed');
  const rankLadder = document.getElementById('rankLadder');
  const againBtn = document.getElementById('againBtn');

  let mode = 'time';
  let operation = 'mul';
  let selectedTables = new Set(Array.from({ length: MAX_TABLE }, (_, i) => i + 1));
  let originScreen = 'practice'; // which setup screen to return to on "again"

  // ---------- Round state ----------
  let queue = [];
  let correctCount = 0;
  let wrongCount = 0;
  let secondsLeft = ROUND_SECONDS;
  let roundStartTime = 0;
  let lastElapsedSeconds = 0;
  let hasResult = false;
  let timerId = null;
  let running = false;

  // ---------- Screen navigation ----------
  function showScreen(el) {
    [landingScreen, testSetupScreen, setupScreen, testScreen, resultScreen].forEach(s => {
      s.style.display = 'none';
    });
    el.style.display = el === testScreen ? 'flex' : 'block';
  }

  chooseTestBtn.addEventListener('click', () => {
    syncModeUI();
    showScreen(testSetupScreen);
  });
  choosePracticeBtn.addEventListener('click', () => {
    syncModeUI();
    showScreen(setupScreen);
  });
  function goHome() {
    clearInterval(timerId);
    running = false;
    document.body.style.backgroundColor = '';
    showScreen(landingScreen);
  }

  backFromTest.addEventListener('click', goHome);
  backFromPractice.addEventListener('click', goHome);
  headerTitle.addEventListener('click', goHome);

  // ---------- Mode / operation / tables helpers ----------
  function syncModeUI() {
    const s = t();
    [modeButtons, testModeButtons].forEach(group => {
      group.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    });
    modeSub.textContent = mode === 'time' ? s.modeSubTime : s.modeSubCount;
    startBtn.textContent = mode === 'time' ? s.startTime : s.startCount;
    startHint.textContent = mode === 'time' ? s.hintTime : s.hintCount;
    testStartBtn.textContent = mode === 'time' ? s.startTime : s.startCount;
    testStartHint.textContent = mode === 'time' ? s.hintTime : s.hintCount;
  }

  function setOperation(op) {
    operation = op;
    opButtons.forEach(b => b.classList.toggle('active', b.dataset.op === op));
  }

  function setAllTablesSelected() {
    tableGrid.querySelectorAll('input').forEach(cb => {
      cb.checked = true;
      cb.closest('label').classList.add('checked');
    });
    selectedTables = new Set(Array.from({ length: MAX_TABLE }, (_, i) => i + 1));
    updateStartButton();
  }

  // ---------- Language ----------
  function renderLiveLabel() {
    if (mode === 'time') {
      liveScoreLabel.innerHTML = t().liveCorrect + '<b id="liveScore">' + correctCount + '</b>';
    } else {
      const totalAnswered = correctCount + wrongCount;
      liveScoreLabel.innerHTML = t().liveQuestion + '<b id="liveScore">' + totalAnswered + '</b> / ' + COUNT_TARGET;
    }
  }

  function renderResultText() {
    const s = t();
    const totalAnswered = correctCount + wrongCount;
    const avgSpeed = totalAnswered > 0 ? lastElapsedSeconds / totalAnswered : 0;

    if (mode === 'time') {
      resultTitle.textContent = s.resultTitleTime;
      resultHeadline.textContent = correctCount;
      resultCaption.textContent = s.resultCaptionTime;
    } else {
      resultTitle.textContent = s.resultTitleCount;
      resultHeadline.textContent = lastElapsedSeconds.toFixed(1).replace('.', ',') + ' s';
      resultCaption.textContent = s.resultCaptionCount;
    }
    document.getElementById('lblStatCorrect').textContent = s.statCorrect;
    document.getElementById('lblStatWrong').textContent = s.statWrong;
    document.getElementById('lblStatSpeed').textContent = s.statSpeed;
    againBtn.textContent = s.again;
    statCorrect.textContent = correctCount;
    statWrong.textContent = wrongCount;
    statSpeed.textContent = avgSpeed.toFixed(2).replace('.', ',') + ' s';
    renderRankLadder(avgSpeed, totalAnswered);

    if (totalAnswered > 0) {
      document.body.style.backgroundColor = speedToBgColor(avgSpeed);
    } else {
      document.body.style.backgroundColor = '';
    }
  }

  function applyLanguage() {
    const s = t();
    try { localStorage.setItem('tabelltraning_lang', lang); } catch (e) { /* ignore */ }
    document.documentElement.lang = lang;
    document.title = s.title;
    headerTitle.textContent = s.title;
    langToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));

    document.getElementById('landingHeading').textContent = s.landingHeading;
    document.getElementById('landingTestTitle').textContent = s.testTitle;
    document.getElementById('landingTestDesc').textContent = s.testDesc;
    document.getElementById('landingPracticeTitle').textContent = s.practiceTitle;
    document.getElementById('landingPracticeDesc').textContent = s.practiceDesc;

    backFromTest.textContent = s.back;
    backFromPractice.textContent = s.back;
    document.getElementById('testSetupHeading').textContent = s.testTitle;
    document.getElementById('testSetupInfo').textContent = s.testInfo;
    testModeButtons[0].textContent = s.mode1min;
    testModeButtons[1].textContent = s.mode100;

    document.getElementById('labelChooseMode').textContent = s.chooseMode;
    modeButtons[0].textContent = s.mode1min;
    modeButtons[1].textContent = s.mode100;

    document.getElementById('labelChooseOp').textContent = s.chooseOp;
    opButtons[0].textContent = s.opMul;
    opButtons[1].textContent = s.opDiv;
    opButtons[2].textContent = s.opMix;

    document.getElementById('labelChooseTables').textContent = s.chooseTables;
    selectAllBtn.textContent = s.selectAll;
    selectNoneBtn.textContent = s.selectNone;

    syncModeUI();

    document.getElementById('previewTitle').textContent = s.previewTitle;
    document.getElementById('previewNextLbl').textContent = s.previewNext;
    document.getElementById('previewThenLbl').textContent = s.previewThen;
    answerInput.setAttribute('aria-label', s.answerAria);

    renderLiveLabel();
    if (hasResult) renderResultText();
  }

  langToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-lang]');
    if (!btn || btn.dataset.lang === lang) return;
    lang = btn.dataset.lang;
    applyLanguage();
  });

  // Build table checkboxes 1..MAX_TABLE
  for (let n = 1; n <= MAX_TABLE; n++) {
    const label = document.createElement('label');
    label.className = 'checked';
    label.innerHTML = '<input type="checkbox" value="' + n + '" checked><span>' + n + '</span>';
    tableGrid.appendChild(label);
    label.querySelector('input').addEventListener('change', (e) => {
      if (e.target.checked) {
        selectedTables.add(n);
        label.classList.add('checked');
      } else {
        selectedTables.delete(n);
        label.classList.remove('checked');
      }
      updateStartButton();
    });
  }

  [...modeButtons, ...testModeButtons].forEach(btn => {
    btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      syncModeUI();
    });
  });

  opButtons.forEach(btn => {
    btn.addEventListener('click', () => setOperation(btn.dataset.op));
  });

  selectAllBtn.addEventListener('click', setAllTablesSelected);

  selectNoneBtn.addEventListener('click', () => {
    tableGrid.querySelectorAll('input').forEach(cb => {
      cb.checked = false;
      cb.closest('label').classList.remove('checked');
    });
    selectedTables.clear();
    updateStartButton();
  });

  function updateStartButton() {
    startBtn.disabled = selectedTables.size === 0;
  }

  // ---------- Result background color (green -> orange by speed) ----------
  function speedToBgColor(avgSpeed) {
    const green = [63, 174, 116];
    const orange = [224, 138, 60];
    const clamped = Math.max(ACCEPTABLE_THRESHOLD, Math.min(BG_WORST_AT, avgSpeed));
    const ratio = (clamped - ACCEPTABLE_THRESHOLD) / (BG_WORST_AT - ACCEPTABLE_THRESHOLD);
    const rgb = green.map((g, i) => Math.round(g + (orange[i] - g) * ratio));
    return 'rgb(' + rgb.join(',') + ')';
  }

  // ---------- Rank ladder ----------
  function renderRankLadder(avgSpeedSeconds, totalAnswered) {
    if (totalAnswered === 0) {
      rankLadder.style.display = 'none';
      rankLadder.innerHTML = '';
      return;
    }
    const tiers = t().tiers;
    const youLabel = t().tierYou;
    const markerLabel = t().acceptableLabel;
    rankLadder.style.display = 'flex';
    const achievedIndex = tiers.findIndex(tier => avgSpeedSeconds <= tier.max);
    const markerAt = tiers.findIndex(tier => tier.max > ACCEPTABLE_THRESHOLD);

    const markerHtml = '<div class="rank-marker">'
      + '<span class="rank-marker-line"></span>'
      + '<span class="rank-marker-label">' + markerLabel + '</span>'
      + '<span class="rank-marker-line"></span>'
      + '</div>';

    rankLadder.innerHTML = tiers.map((tier, i) => {
      const achieved = i === achievedIndex;
      const tierHtml = '<div class="rank-tier' + (achieved ? ' achieved' : '') + '">'
        + '<span class="tier-step">' + (tiers.length - i) + '</span>'
        + '<span class="tier-body">'
        +   '<span class="tier-top">'
        +     '<span class="tier-name">' + tier.label + '</span>'
        +     '<span class="tier-range">' + tier.range + '</span>'
        +   '</span>'
        +   '<span class="tier-desc">' + tier.desc + '</span>'
        + '</span>'
        + (achieved ? '<span class="tier-you">' + youLabel + '</span>' : '')
        + '</div>';
      return (i === markerAt ? markerHtml : '') + tierHtml;
    }).join('');
  }

  // ---------- Problem generation ----------
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function pickTable() {
    const arr = Array.from(selectedTables);
    return arr[randInt(0, arr.length - 1)];
  }

  function makeProblem() {
    let op = operation;
    if (op === 'mix') op = Math.random() < 0.5 ? 'mul' : 'div';

    const table = pickTable();
    const factor = randInt(1, 10);

    if (op === 'mul') {
      const a = Math.random() < 0.5 ? table : factor;
      const b = a === table ? factor : table;
      return { text: a + ' × ' + b + ' =', answer: table * factor };
    } else {
      const dividend = table * factor;
      return { text: dividend + ' ÷ ' + table + ' =', answer: factor };
    }
  }

  function refillQueue() {
    while (queue.length < 3) queue.push(makeProblem());
  }

  function renderCurrent() {
    refillQueue();
    problemText.textContent = queue[0].text;
    preview1.textContent = queue[1].text;
    preview2.textContent = queue[2].text;
  }

  function startRound() {
    correctCount = 0;
    wrongCount = 0;
    queue = [];
    running = true;
    hasResult = false;
    roundStartTime = performance.now();
    document.body.style.backgroundColor = '';

    showScreen(testScreen);

    answerInput.value = '';

    if (mode === 'time') {
      secondsLeft = ROUND_SECONDS;
      timerDisplay.textContent = secondsLeft;
      timerBar.style.width = '100%';
    } else {
      timerDisplay.textContent = '0,0 s';
      timerBar.style.width = '0%';
    }
    renderLiveLabel();

    renderCurrent();
    answerInput.focus();

    clearInterval(timerId);
    timerId = setInterval(mode === 'time' ? tickTime : tickCount, 100);
  }

  let tickAccum = 0;
  function tickTime() {
    tickAccum += 100;
    if (tickAccum < 1000) return;
    tickAccum = 0;
    secondsLeft--;
    timerDisplay.textContent = secondsLeft;
    timerBar.style.width = (secondsLeft / ROUND_SECONDS * 100) + '%';
    if (secondsLeft <= 0) endRound();
  }

  function tickCount() {
    const elapsed = (performance.now() - roundStartTime) / 1000;
    timerDisplay.textContent = elapsed.toFixed(1).replace('.', ',') + ' s';
  }

  function endRound() {
    running = false;
    clearInterval(timerId);
    showScreen(resultScreen);

    lastElapsedSeconds = mode === 'time'
      ? ROUND_SECONDS
      : (performance.now() - roundStartTime) / 1000;
    hasResult = true;

    renderResultText();
  }

  function submitAnswer() {
    if (!running) return;
    const raw = answerInput.value.trim();
    if (raw === '') return;

    const given = parseInt(raw, 10);
    const correct = queue[0].answer;
    const isCorrect = given === correct;

    if (isCorrect) {
      correctCount++;
      flash('flash-correct');
    } else {
      wrongCount++;
      flash('flash-wrong');
    }

    renderLiveLabel();

    if (mode === 'count') {
      const totalAnswered = correctCount + wrongCount;
      timerBar.style.width = (totalAnswered / COUNT_TARGET * 100) + '%';
      if (totalAnswered >= COUNT_TARGET) {
        endRound();
        return;
      }
    }

    queue.shift();
    answerInput.value = '';
    renderCurrent();
  }

  let flashTimeout = null;
  function flash(cls) {
    problemBox.classList.remove('flash-correct', 'flash-wrong');
    void problemBox.offsetWidth; // restart animation
    problemBox.classList.add(cls);
    clearTimeout(flashTimeout);
    flashTimeout = setTimeout(() => problemBox.classList.remove(cls), 250);
  }

  answerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.repeat) {
      e.preventDefault();
      submitAnswer();
    }
  });

  testStartBtn.addEventListener('click', () => {
    setAllTablesSelected();
    setOperation('mix');
    originScreen = 'test';
    startRound();
  });

  startBtn.addEventListener('click', () => {
    originScreen = 'practice';
    startRound();
  });

  againBtn.addEventListener('click', () => {
    document.body.style.backgroundColor = '';
    showScreen(originScreen === 'test' ? testSetupScreen : setupScreen);
  });

  updateStartButton();
  applyLanguage();
  showScreen(landingScreen);
})();
</script>
