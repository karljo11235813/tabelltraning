<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textuppgifter — Övning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: #f3eef9;
    --surface: #ffffff;
    --accent: #7a4a8c;
    --accent-strong: #5f3870;
    --accent-soft: #ece0f5;
    --text: #221b28;
    --text-muted: #6f6478;
    --success: #2f8f6f;
    --success-soft: #e6f5ef;
    --danger: #b23b3b;
    --danger-soft: #fbecec;
    --border: #d8cfe0;
    --shadow: 0 2px 14px rgba(45, 24, 58, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1420;
      --surface: #251c2c;
      --accent: #c9a0dd;
      --accent-strong: #ddbaef;
      --accent-soft: #382a44;
      --text: #f0e9f5;
      --text-muted: #b7a9c2;
      --success: #5fcfa0;
      --success-soft: #203a30;
      --danger: #e2837f;
      --danger-soft: #402226;
      --border: #453a4f;
      --shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1420;
    --surface: #251c2c;
    --accent: #c9a0dd;
    --accent-strong: #ddbaef;
    --accent-soft: #382a44;
    --text: #f0e9f5;
    --text-muted: #b7a9c2;
    --success: #5fcfa0;
    --success-soft: #203a30;
    --danger: #e2837f;
    --danger-soft: #402226;
    --border: #453a4f;
    --shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    font-family: "Nunito Sans", "Segoe UI", "Arial", sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1, h2 { font-family: "Baloo 2", "Segoe UI", sans-serif; }
  header {
    width: 100%;
    background: var(--accent);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .header-title {
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 0.3px;
    background: none;
    border: none;
    color: inherit;
    padding: 0;
    cursor: pointer;
    text-decoration: none;
  }
  .header-title:hover { opacity: 0.85; }
  main {
    width: 100%;
    max-width: 560px;
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .card {
    background: var(--surface);
    border-radius: 12px;
    padding: 22px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    margin: 0 0 10px 0;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
  }
  a.back-link {
    color: var(--accent);
    font-family: "Nunito Sans", sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 16px;
  }

  .category-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 4px 0 22px;
  }
  .category-row button {
    padding: 8px 12px;
    border: 2px solid var(--accent);
    background: var(--surface);
    color: var(--accent);
    border-radius: 999px;
    font-family: "Nunito Sans", sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .category-row button.active {
    background: var(--accent);
    color: #fff;
  }
  .category-row button:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 2px;
  }

  .score-line {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }
  .score-line b { color: var(--text); }

  .problem-box {
    background: var(--surface);
    border-radius: 14px;
    padding: 22px;
    text-align: left;
    box-shadow: var(--shadow);
    border: 3px solid transparent;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 16px;
  }
  .problem-box.flash-correct { border-color: var(--success); background: var(--success-soft); }
  .problem-box.flash-wrong { border-color: var(--danger); background: var(--danger-soft); }

  .problem-text {
    font-size: 1.05rem;
    line-height: 1.55;
    color: var(--text);
    margin-bottom: 18px;
  }

  .step-label {
    font-family: "Nunito Sans", sans-serif;
    font-weight: 800;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
    margin: 14px 0 8px;
  }
  .step-label:first-of-type { margin-top: 0; }

  .op-choice-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 4px;
  }
  .op-choice-row button {
    padding: 10px 0;
    border: 2px solid var(--accent);
    background: var(--surface);
    color: var(--accent);
    border-radius: 9px;
    font-family: "Baloo 2", sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .op-choice-row button.active {
    background: var(--accent);
    color: #fff;
  }
  .op-choice-row button:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 2px;
  }

  .op-feedback {
    min-height: 1.2em;
    font-size: 0.8rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .op-feedback.correct { color: var(--success); }
  .op-feedback.wrong { color: var(--danger); }

  .calc-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0 4px;
    flex-wrap: wrap;
  }
  .box-input {
    width: 76px;
    font-family: "Baloo 2", sans-serif;
    font-size: 1.15rem;
    text-align: center;
    padding: 8px 4px;
    border: 2px solid var(--accent);
    border-radius: 8px;
    outline: none;
    background: var(--surface);
    color: var(--text);
  }
  .box-input:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 2px;
  }
  .box-input.result {
    border-style: dashed;
  }
  .calc-symbol {
    font-family: "Baloo 2", sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
    min-width: 1ch;
    text-align: center;
  }

  .answer-unit {
    display: block;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 10px;
  }

  .feedback {
    margin-top: 14px;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .feedback-line { font-weight: 700; }
  .feedback-line.correct { color: var(--success); }
  .feedback-line.wrong { color: var(--danger); }
  .feedback-note {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--accent-soft);
    border-radius: 8px;
    color: var(--text);
    font-weight: 400;
    font-style: italic;
  }

  #checkBtn {
    display: block;
    width: 100%;
    min-width: 130px;
    margin-top: 18px;
    padding: 12px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-family: "Baloo 2", sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
  }
  #checkBtn:hover { background: var(--accent-strong); }
  #checkBtn:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 2px;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    justify-content: flex-end;
  }
  .btn-row button {
    min-width: 130px;
    padding: 12px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-family: "Baloo 2", sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-row button:hover { background: var(--accent-strong); }
  .btn-row button:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 2px;
  }
  .btn-row button.secondary {
    background: var(--surface);
    color: var(--accent);
    border: 2px solid var(--accent);
  }

  .hint {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <a class="header-title" href="index.html">Tabellträning</a>
</header>

<main>
  <div class="card">
    <a class="back-link" href="index.html">← Tillbaka</a>
    <h2>Textuppgifter — övning</h2>

    <div class="category-row" id="categoryRow">
      <button type="button" data-cat="mixed" class="active">Blandat</button>
      <button type="button" data-cat="grunderna">Grunderna</button>
      <button type="button" data-cat="nyckelord">Nyckelord som lurar</button>
      <button type="button" data-cat="enheter">Enheter</button>
      <button type="button" data-cat="jamforelse">Jämförelse</button>
      <button type="button" data-cat="division">Dela lika eller grupper?</button>
      <button type="button" data-cat="area">Area och omkrets</button>
      <button type="button" data-cat="flersteg">Flerstegsproblem</button>
      <button type="button" data-cat="distraktion">Överflödig information</button>
    </div>

    <div class="score-line" id="scoreLine">Rätt: <b id="scoreCorrect">0</b> av <b id="scoreTotal">0</b></div>

    <div class="problem-box" id="problemBox">
      <div class="problem-text" id="problemText">–</div>

      <div class="step-label" id="step1Label">Vilket räknesätt passar?</div>
      <div class="op-choice-row" id="opRow1">
        <button type="button" data-op="+">+</button>
        <button type="button" data-op="−">−</button>
        <button type="button" data-op="×">×</button>
        <button type="button" data-op="/">/</button>
      </div>
      <div class="op-feedback" id="opFeedback1"></div>

      <div class="calc-row" id="calcRow1" style="display:none;">
        <input type="text" class="box-input" id="box_a1" inputmode="decimal" aria-label="Första talet, steg 1">
        <span class="calc-symbol" id="calcOp1"></span>
        <input type="text" class="box-input" id="box_b1" inputmode="decimal" aria-label="Andra talet, steg 1">
        <span class="calc-symbol">=</span>
        <input type="text" class="box-input result" id="box_result1" inputmode="decimal" aria-label="Resultat, steg 1">
      </div>

      <div id="step2Block" style="display:none;">
        <div class="step-label">Steg 2: vilket räknesätt?</div>
        <div class="op-choice-row" id="opRow2">
          <button type="button" data-op="+">+</button>
          <button type="button" data-op="−">−</button>
          <button type="button" data-op="×">×</button>
          <button type="button" data-op="/">/</button>
        </div>
        <div class="op-feedback" id="opFeedback2"></div>

        <div class="calc-row" id="calcRow2" style="display:none;">
          <input type="text" class="box-input" id="box_a2" inputmode="decimal" aria-label="Första talet, steg 2">
          <span class="calc-symbol" id="calcOp2"></span>
          <input type="text" class="box-input" id="box_b2" inputmode="decimal" aria-label="Andra talet, steg 2">
          <span class="calc-symbol">=</span>
          <input type="text" class="box-input result" id="box_result2" inputmode="decimal" aria-label="Svar">
        </div>
      </div>

      <span class="answer-unit" id="answerUnit"></span>

      <div class="feedback" id="feedback"></div>

      <button type="button" id="checkBtn">Kontrollera</button>
    </div>

    <div class="btn-row">
      <button type="button" class="secondary" id="nextBtn">Nästa</button>
    </div>

    <div class="hint">Välj räknesätt först — du får direkt besked om det stämmer. När det är rätt visas rutorna: fyll i talen och räkna ut svaret.</div>
  </div>
</main>

<script>
(function () {
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // ---------- Curated problem bank ----------
  // Sourced from talochräkning/kuraterad_problemuppsattning_valja_raknesatt.md,
  // raknesatt_textuppgifter_forskningsoversikt_och_diagnostiska_mallar.md, and
  // textuppgifter_valja_raknesatt.md. Text is real Swedish prose, not generated —
  // random *generation* of grammatically-correct word problems isn't safe, so
  // this page randomly *selects* from a curated bank instead.
  //
  // Every number the student is asked to place in a box is stored explicitly
  // (a1/b1, and a2/b2 for a second step) so "right operation, wrong numbers"
  // is graded correctly — not just "does some expression evaluate right".
  // For a two-step item, `mid` is step 1's own exact result (a1 op1 b1);
  // it always reappears as either a2 or b2 in step 2 (never silently
  // re-derived at grading time — every number here was hand-verified).
  //
  // Single-step items: { text, op, a1, b1, answer, unit, note? }
  // Multi-step items:  { text, ops: [op1, op2], a1, b1, mid, a2, b2, answer, unit, note? }
  //
  // `alt1` / `alt2` (optional): for a step that reconciles two quantities
  // originally stated in different units, there are two equally valid
  // conversion directions (e.g. convert kg to g, or g to kg). `alt1` is
  // step 1's alternate { a, b, r } triple using the other direction;
  // `alt2` is step 2's. Both the primary numbers and the alt triple are
  // fully self-consistent sets, checked as whole alternatives — never
  // mixed — so either a real, equally correct path is accepted in full.

  const BANK = {
    grunderna: [
      { text: 'En buss har 18 elever. Vid nästa hållplats kliver 7 elever på. Hur många elever är på bussen nu?', op: '+', a1: 18, b1: 7, answer: 25, unit: 'elever' },
      { text: 'En elev har 200 kr. Hen köper lunch för 68 kr. Hur mycket pengar har eleven kvar?', op: '−', a1: 200, b1: 68, answer: 132, unit: 'kr' },
      { text: 'En låda innehåller 24 pennor. Skolan köper 7 lådor. Hur många pennor köper skolan?', op: '×', a1: 24, b1: 7, answer: 168, unit: 'pennor' },
      { text: 'En klass har 28 elever. Eleverna ska arbeta i grupper med 4 elever i varje grupp. Hur många grupper blir det?', op: '/', a1: 28, b1: 4, answer: 7, unit: 'grupper' },
      { text: 'Ett paket med 8 yoghurtar kostar 36 kr. Vad kostar en yoghurt?', op: '/', a1: 36, b1: 8, answer: 4.5, unit: 'kr' },
      { text: 'Ett recept behöver 250 g mjöl, 150 g socker och 75 g smör. Hur mycket väger ingredienserna tillsammans?', ops: ['+', '+'], a1: 250, b1: 150, mid: 400, a2: 400, b2: 75, answer: 475, unit: 'g', note: 'Lägg ihop två åt gången: 250 + 150 = 400, sedan 400 + 75 = 475.' },
      { text: 'En bil kör 360 km på 4 timmar. Hur långt kör bilen på en timme om hastigheten är jämn?', op: '/', a1: 360, b1: 4, answer: 90, unit: 'km' },
      { text: 'Ett klassrum har 6 rader med 5 stolar i varje rad. Hur många stolar finns det?', op: '×', a1: 6, b1: 5, answer: 30, unit: 'stolar' },
      { text: 'Målet är att läsa 120 sidor. Eleven har läst 76 sidor. Hur många sidor återstår?', op: '−', a1: 120, b1: 76, answer: 44, unit: 'sidor' },
      { text: 'En hiss får bära 500 kg. Fyra personer väger tillsammans 326 kg. Hur mycket vikt finns kvar innan maxgränsen nås?', op: '−', a1: 500, b1: 326, answer: 174, unit: 'kg' },
      { text: 'En elev cyklar 3,5 km varje dag i 6 dagar. Hur långt cyklar eleven sammanlagt?', op: '×', a1: 3.5, b1: 6, answer: 21, unit: 'km' },
      { text: 'Ett äpple kostar 4,50 kr. Vad kostar 8 äpplen?', op: '×', a1: 4.5, b1: 8, answer: 36, unit: 'kr' },
    ],

    nyckelord: [
      { text: 'Leo har 34 kr. Det är 12 kr mer än vad Sam har. Hur mycket pengar har Sam?', op: '−', a1: 34, b1: 12, answer: 22, unit: 'kr', note: 'Ordet "mer" lockar till addition — men Sam har mindre än Leo, inte mer.' },
      { text: 'Amina har 28 klistermärken. Det är 9 färre än vad Noor har. Hur många klistermärken har Noor?', op: '+', a1: 28, b1: 9, answer: 37, unit: 'klistermärken', note: 'Ordet "färre" lockar till subtraktion — men Noor har fler än Amina.' },
      { text: 'En låda innehåller 18 pennor. Skolan köper 7 lådor. Hur många pennor köper skolan totalt?', op: '×', a1: 18, b1: 7, answer: 126, unit: 'pennor', note: 'Ordet "totalt" lockar till addition — men här är det lika stora grupper, alltså multiplikation.' },
      { text: 'Ett lag har 84 kr att dela lika mellan 6 spelare. Hur mycket får varje spelare?', op: '/', a1: 84, b1: 6, answer: 14, unit: 'kr', note: 'Ordet "varje" kan kännas som multiplikation — men här delas en summa lika, alltså division.' },
      { text: 'En tårta är delad i 12 bitar. Efter fikat finns 5 bitar kvar. Hur många bitar åt gruppen?', op: '−', a1: 12, b1: 5, answer: 7, unit: 'bitar', note: 'Ordet "delad" lockar till division — men frågan handlar om hur mycket som är borta, alltså subtraktion.' },
    ],

    enheter: [
      { text: 'Ett rep är 3 m långt och klipps i bitar som är 10 cm långa. Hur många bitar blir det?', op: '/', a1: 300, b1: 10, answer: 30, unit: 'bitar', note: 'Gör om till samma enhet först: 3 m = 300 cm.', alt1: { a: 3, b: 0.1, r: 30 } },
      { text: 'En flaska innehåller 1,5 liter saft. Klassen dricker 8 dl. Hur mycket saft finns kvar?', op: '−', a1: 15, b1: 8, answer: 7, unit: 'dl', note: '1,5 liter = 15 dl.', alt1: { a: 1.5, b: 0.8, r: 0.7 } },
      { text: 'En elev springer 1,2 km och går sedan 850 m. Hur långt rör sig eleven totalt?', op: '+', a1: 1200, b1: 850, answer: 2050, unit: 'm', note: '1,2 km = 1200 m.', alt1: { a: 1.2, b: 0.85, r: 2.05 } },
      { text: 'En maskin fyller 250 ml i varje flaska. Den fyller 36 flaskor. Hur många milliliter fyller maskinen totalt?', op: '×', a1: 250, b1: 36, answer: 9000, unit: 'ml', note: '250 ml × 36 = 9000 ml (= 9 liter).' },
      { text: 'En påse innehåller 1,8 kg mjöl. Ett recept behöver 300 g mjöl. Hur många recept räcker mjölet till?', op: '/', a1: 1800, b1: 300, answer: 6, unit: 'recept', note: '1,8 kg = 1800 g.', alt1: { a: 1.8, b: 0.3, r: 6 } },
      { text: 'En penna är 17 cm lång och en annan penna är 128 mm lång. Hur mycket längre är den första pennan?', op: '−', a1: 17, b1: 12.8, answer: 4.2, unit: 'cm', note: '128 mm = 12,8 cm.', alt1: { a: 170, b: 128, r: 42 } },
      { text: 'En klass gör 12 affischer. Varje affisch behöver 35 cm tejp. Hur många centimeter tejp behövs totalt?', op: '×', a1: 12, b1: 35, answer: 420, unit: 'cm', note: '12 × 35 cm = 420 cm (= 4,2 m).' },
      { text: 'En 5 liter dunk ska fyllas i flaskor som rymmer 250 ml. Hur många flaskor behövs?', op: '/', a1: 5000, b1: 250, answer: 20, unit: 'flaskor', note: '5 liter = 5000 ml.', alt1: { a: 5, b: 0.25, r: 20 } },
      { text: 'En tygbit är 4,8 m lång. Varje kudde behöver 60 cm tyg. Hur många kuddar räcker tyget till?', op: '/', a1: 480, b1: 60, answer: 8, unit: 'kuddar', note: '4,8 m = 480 cm.', alt1: { a: 4.8, b: 0.6, r: 8 } },
    ],

    jamforelse: [
      { text: 'Mira har 12 kulor. Aron har 4 fler än Mira. Hur många kulor har Aron?', op: '+', a1: 12, b1: 4, answer: 16, unit: 'kulor', note: '"Fler än" är en additiv jämförelse — man lägger till skillnaden.' },
      { text: 'Mira har 12 kulor. Aron har 4 gånger så många som Mira. Hur många kulor har Aron?', op: '×', a1: 12, b1: 4, answer: 48, unit: 'kulor', note: '"Gånger så många" är en multiplikativ jämförelse — man multiplicerar med faktorn.' },
      { text: 'Sara springer 4 varv på 10 minuter. Efter 15 minuter har hon sprungit 9 varv. Hur många fler varv sprang hon under de sista 5 minuterna?', op: '−', a1: 9, b1: 4, answer: 5, unit: 'varv', note: 'Det ser proportionellt ut (4 varv på 10 minuter), men frågan söker bara skillnaden mellan 9 och 4 varv.' },
      { text: 'En ritning har skalan 1:50. Ett bord är 3 cm långt på ritningen. Hur långt är bordet i verkligheten, i cm?', op: '×', a1: 3, b1: 50, answer: 150, unit: 'cm', note: 'Skalfaktorn multipliceras med ritningens mått: 3 cm × 50 = 150 cm (= 1,5 m).' },
    ],

    division: [
      { text: '2,4 kg ris delas lika i 6 burkar. Hur mycket ris får varje burk?', op: '/', a1: 2.4, b1: 6, answer: 0.4, unit: 'kg', note: 'Delningsdivision: gruppstorleken är okänd.' },
      { text: '2,4 kg ris ska packas i påsar med 300 g i varje. Hur många påsar räcker riset till?', op: '/', a1: 2400, b1: 300, answer: 8, unit: 'påsar', note: 'Gör om till gram: 2,4 kg = 2400 g. Innehållsdivision: antalet grupper är okänt.', alt1: { a: 2.4, b: 0.3, r: 8 } },
      { text: 'Ett rep är 5 m långt. Det klipps i bitar som är 80 cm. Hur många hela bitar kan man få?', op: '/', a1: 500, b1: 80, answer: 6, unit: 'hela bitar', note: '500 cm / 80 cm = 6,25 — men man kan bara få 6 HELA bitar. Avrunda nedåt.', alt1: { a: 5, b: 0.8, r: 6 } },
      { text: '5 m rep ska packas i påsar. Varje påse rymmer 80 cm rep. Hur många påsar behövs?', op: '/', a1: 500, b1: 80, answer: 7, unit: 'påsar', note: 'Samma division som föregående (500/80 = 6,25), men nu behövs en påse extra för resten. Avrunda uppåt.', alt1: { a: 5, b: 0.8, r: 7 } },
      { text: '3 meter rep klipps i bitar som är 0,25 m långa. Hur många bitar blir det?', op: '/', a1: 3, b1: 0.25, answer: 12, unit: 'bitar', note: 'Division med ett tal mindre än 1 ger ett svar som är större än 3.' },
      { text: '0,6 kg äpplen kostar 18 kr. Vad kostar 1 kg äpplen?', op: '/', a1: 18, b1: 0.6, answer: 30, unit: 'kr', note: 'Division kan ge ett svar som är större än talet du delar med.' },
    ],

    area: [
      { text: 'Ett klassrum är 8 m långt och 6 m brett. Hur stor area har klassrummet?', op: '×', a1: 8, b1: 6, answer: 48, unit: 'm²', note: 'Area = längd gånger bredd.' },
      { text: 'Ett klassrum är 8 m långt och 6 m brett. Hur lång är omkretsen?', ops: ['+', '×'], a1: 8, b1: 6, mid: 14, a2: 14, b2: 2, answer: 28, unit: 'm', note: 'Omkrets = (längd + bredd) × 2, inte area! 8 + 6 = 14, sedan 14 × 2 = 28.' },
      { text: 'En rektangulär matta är 2,4 m lång och 1,5 m bred. Hur många meter kantband behövs runt mattan?', ops: ['+', '×'], a1: 2.4, b1: 1.5, mid: 3.9, a2: 3.9, b2: 2, answer: 7.8, unit: 'm', note: 'Omkrets = (längd + bredd) × 2: 2,4 + 1,5 = 3,9, sedan 3,9 × 2 = 7,8.' },
      { text: 'En skylt är 30 cm bred och 20 cm hög. Vad är skyltens area?', op: '×', a1: 30, b1: 20, answer: 600, unit: 'cm²', note: 'Area = bredd gånger höjd.' },
    ],

    flersteg: [
      { text: 'En klass köper 6 paket pennor. Varje paket innehåller 12 pennor. 17 pennor delas ut direkt. Hur många pennor finns kvar?', ops: ['×', '−'], a1: 6, b1: 12, mid: 72, a2: 72, b2: 17, answer: 55, unit: 'pennor' },
      { text: 'En elev har 5 meter snöre. Hen klipper bort 80 cm. Resten klipps i bitar som är 20 cm långa. Hur många bitar blir det?', ops: ['−', '/'], a1: 500, b1: 80, mid: 420, a2: 420, b2: 20, answer: 21, unit: 'bitar', note: '5 m = 500 cm.', alt1: { a: 5, b: 0.8, r: 4.2 }, alt2: { a: 4.2, b: 0.2, r: 21 } },
      { text: 'En affär säljer 4 likadana vattenflaskor för 92 kr. Vad kostar 7 sådana flaskor?', ops: ['/', '×'], a1: 92, b1: 4, mid: 23, a2: 23, b2: 7, answer: 161, unit: 'kr', note: 'Först pris per styck (92/4 = 23 kr), sedan för 7 stycken (23 × 7).' },
      { text: 'En hink innehåller 7,5 liter vatten. Eleverna häller upp 12 muggar med 250 ml i varje. Hur många milliliter vatten finns kvar?', ops: ['×', '−'], a1: 12, b1: 250, mid: 3000, a2: 7500, b2: 3000, answer: 4500, unit: 'ml', note: '12 × 250 ml = 3000 ml. Hinken rymmer 7,5 liter = 7500 ml. (4500 ml = 4,5 liter)', alt2: { a: 7.5, b: 3, r: 4.5 } },
      { text: 'En vandring är 8 km. Klassen har gått 3,25 km före lunch och 1800 m efter lunch. Hur långt är det kvar?', ops: ['+', '−'], a1: 3.25, b1: 1.8, mid: 5.05, a2: 8, b2: 5.05, answer: 2.95, unit: 'km', note: '1800 m = 1,8 km. 3,25 + 1,8 = 5,05 km gått.', alt1: { a: 3250, b: 1800, r: 5050 }, alt2: { a: 8000, b: 5050, r: 2950 } },
      { text: 'En låda väger 1,8 kg tom. Varje bok väger 350 g. Hur mycket väger lådan med 12 böcker?', ops: ['×', '+'], a1: 12, b1: 0.35, mid: 4.2, a2: 4.2, b2: 1.8, answer: 6, unit: 'kg', note: '350 g = 0,35 kg. 12 × 0,35 kg = 4,2 kg.', alt1: { a: 12, b: 350, r: 4200 }, alt2: { a: 4200, b: 1800, r: 6000 } },
      { text: 'En lärare har 8 paket med 25 papper i varje. Klassen använder 73 papper. Hur många papper finns kvar?', ops: ['×', '−'], a1: 8, b1: 25, mid: 200, a2: 200, b2: 73, answer: 127, unit: 'papper' },
      { text: 'En rulle tejp är 8 m lång. Klassen använder 14 bitar som är 35 cm vardera. Hur många centimeter tejp finns kvar?', ops: ['×', '−'], a1: 14, b1: 35, mid: 490, a2: 800, b2: 490, answer: 310, unit: 'cm', note: '8 m = 800 cm. (310 cm = 3,1 m)', alt2: { a: 8, b: 4.9, r: 3.1 } },
      { text: 'En växt är 10 cm på måndag och 16 cm på fredag. En annan växt är 20 cm på måndag. Om den växer lika många centimeter, hur hög är den på fredag?', ops: ['−', '+'], a1: 16, b1: 10, mid: 6, a2: 6, b2: 20, answer: 26, unit: 'cm', note: 'Samma ÖKNING (skillnad), inte samma förhållande: 16 − 10 = 6 är ökningen, sedan 6 + 20 = 26.' },
      { text: 'Ett recept använder 10 g jäst till 16 dl degvätska. Hur mycket jäst behövs till 32 dl degvätska om förhållandet ska vara samma?', ops: ['/', '×'], a1: 32, b1: 16, mid: 2, a2: 10, b2: 2, answer: 20, unit: 'g', note: 'Samma FÖRHÅLLANDE, inte samma skillnad: 32/16 = 2 är skalfaktorn, sedan 10 × 2 = 20.' },
      { text: 'En skrivare skriver ut 4 sidor på 10 sekunder. Hur många sidor skriver den ut på 15 sekunder om hastigheten är jämn?', ops: ['/', '×'], a1: 4, b1: 10, mid: 0.4, a2: 15, b2: 0.4, answer: 6, unit: 'sidor', note: 'Proportionalitet: 4/10 = 0,4 sidor/sekund (steg 1), sedan 0,4 × 15 = 6 (steg 2).' },
      { text: 'En resa kostar 45 euro per person. En familj med 4 personer ska resa. Växelkursen är 11 kr per euro. Hur mycket kostar resan i kronor?', ops: ['×', '×'], a1: 45, b1: 4, mid: 180, a2: 180, b2: 11, answer: 1980, unit: 'kr', note: 'Först totalt i euro (45 × 4 = 180 €), sedan omräknat till kronor (180 × 11).' },
      { text: 'En bunt med 96 klistermärken delas lika mellan 4 klasser. Varje klass delar sedan sin del lika mellan 6 grupper. Hur många klistermärken får varje grupp?', ops: ['/', '/'], a1: 96, b1: 4, mid: 24, a2: 24, b2: 6, answer: 4, unit: 'klistermärken' },
      { text: 'En bagare bakar 18 kanelbullar på morgonen och 30 till på eftermiddagen. Bullarna packas i påsar med 6 i varje. Hur många påsar blir det?', ops: ['+', '/'], a1: 18, b1: 30, mid: 48, a2: 48, b2: 6, answer: 8, unit: 'påsar' },
      { text: 'Ett bord kostar 800 kr. Kunden får 150 kr rabatt på varje bord. Kunden köper 3 sådana bord till rabatterat pris. Hur mycket kostar de tre borden totalt?', ops: ['−', '×'], a1: 800, b1: 150, mid: 650, a2: 650, b2: 3, answer: 1950, unit: 'kr', note: 'Först rabatterat pris per bord (800 − 150 = 650 kr), sedan för 3 bord (650 × 3).' },
      { text: 'En klass har 132 kr att dela lika mellan 6 elever för en aktivitet. Varje elev betalar sedan 12 kr av sin del för inträde. Hur mycket har varje elev kvar?', ops: ['/', '−'], a1: 132, b1: 6, mid: 22, a2: 22, b2: 12, answer: 10, unit: 'kr' },
    ],

    // Each item below has exactly one number that sounds usable (often the
    // same unit, or the same sentence pattern, as the real ones) but plays
    // no role in the correct computation — testing whether the student
    // reasons from what the question actually asks, not "grab every number".
    distraktion: [
      { text: 'En klass med 24 elever åker på skolresa. Bussen kostar 3 600 kr och delas lika mellan eleverna. Varje elev betalar dessutom 20 kr för lunch. Resan är 45 minuter lång. Hur mycket betalar varje elev totalt?', ops: ['/', '+'], a1: 3600, b1: 24, mid: 150, a2: 150, b2: 20, answer: 170, unit: 'kr', note: 'Restiden (45 minuter) behövs inte för att räkna ut kostnaden — bara distraherande information.' },
      { text: 'En bagare bakar bröd. Ugnen rymmer 8 brödlimpor åt gången och det tar 35 minuter att baka en omgång. Bagaren bakar 6 omgångar och säljer sedan 19 limpor på morgonen. Hur många limpor har hen kvar?', ops: ['×', '−'], a1: 8, b1: 6, mid: 48, a2: 48, b2: 19, answer: 29, unit: 'brödlimpor', note: 'Baktiden (35 minuter) är inte relevant för hur många limpor som bakas — bara distraherande information.' },
      { text: 'En biograf har 18 rader med 22 platser i varje rad. Filmen som visas är 128 minuter lång. Om 15 platser är avbokade, hur många platser är lediga?', ops: ['×', '−'], a1: 18, b1: 22, mid: 396, a2: 396, b2: 15, answer: 381, unit: 'platser', note: 'Filmens längd (128 minuter) har inget med antalet lediga platser att göra — bara distraherande information.' },
      { text: 'En fabrik tillverkar 120 muttrar på 15 minuter. Fabriken har 6 anställda som sköter maskinerna. Hur många muttrar tillverkas på 45 minuter om takten är jämn?', ops: ['/', '×'], a1: 120, b1: 15, mid: 8, a2: 8, b2: 45, answer: 360, unit: 'muttrar', note: 'Antalet anställda (6) behövs inte — takten (muttrar per minut) är redan given för hela fabriken.' },
      { text: 'En affär säljer tröjor för 250 kr styck. Affären ger 60 kr rabatt per tröja på rean. Butiken öppnade för 12 år sedan. En kund köper 5 tröjor till rabatterat pris. Hur mycket betalar kunden totalt?', ops: ['−', '×'], a1: 250, b1: 60, mid: 190, a2: 190, b2: 5, answer: 950, unit: 'kr', note: 'Hur länge butiken funnits (12 år) har inget med priset att göra — bara distraherande information.' },
      { text: 'En rektangulär trädgård är 12 m lång och 7 m bred. Gräsmattan i mitten av trädgården är 3 m bred. Hur lång är omkretsen av hela trädgården?', ops: ['+', '×'], a1: 12, b1: 7, mid: 19, a2: 19, b2: 2, answer: 38, unit: 'm', note: 'Gräsmattans bredd (3 m) används inte för omkretsen — bara trädgårdens yttermått (12 m och 7 m) behövs.' },
    ],
  };
  const CATEGORY_KEYS = Object.keys(BANK);
  const COMMUTATIVE = { '+': true, '×': true, '−': false, '/': false };

  let currentCategory = 'mixed';
  let current = null;
  let lastText = null;
  let correctCount = 0;
  let totalCount = 0;
  let awaitingNext = false;

  const categoryRow = document.getElementById('categoryRow');
  const scoreCorrect = document.getElementById('scoreCorrect');
  const scoreTotal = document.getElementById('scoreTotal');
  const problemBox = document.getElementById('problemBox');
  const problemText = document.getElementById('problemText');
  const step1Label = document.getElementById('step1Label');
  const opRow1 = document.getElementById('opRow1');
  const opFeedback1 = document.getElementById('opFeedback1');
  const calcRow1 = document.getElementById('calcRow1');
  const calcOp1 = document.getElementById('calcOp1');
  const box_a1 = document.getElementById('box_a1');
  const box_b1 = document.getElementById('box_b1');
  const box_result1 = document.getElementById('box_result1');
  const step2Block = document.getElementById('step2Block');
  const opRow2 = document.getElementById('opRow2');
  const opFeedback2 = document.getElementById('opFeedback2');
  const calcRow2 = document.getElementById('calcRow2');
  const calcOp2 = document.getElementById('calcOp2');
  const box_a2 = document.getElementById('box_a2');
  const box_b2 = document.getElementById('box_b2');
  const box_result2 = document.getElementById('box_result2');
  const answerUnit = document.getElementById('answerUnit');
  const feedback = document.getElementById('feedback');
  const checkBtn = document.getElementById('checkBtn');
  const nextBtn = document.getElementById('nextBtn');

  function fmtSv(n) {
    return Number.isInteger(n) ? String(n) : String(n).replace('.', ',');
  }

  function isMultiStep() {
    return Array.isArray(current.ops);
  }

  function pickProblem() {
    const key = currentCategory === 'mixed'
      ? CATEGORY_KEYS[randInt(0, CATEGORY_KEYS.length - 1)]
      : currentCategory;
    const list = BANK[key];
    let item = list[randInt(0, list.length - 1)];
    if (list.length > 1 && item.text === lastText) {
      item = list[randInt(0, list.length - 1)];
    }
    lastText = item.text;
    return item;
  }

  // Per-step gating: step 2 isn't reachable until step 1's numbers AND
  // result are verified correct (not just the operation choice). This
  // keeps the marking unambiguous — a mistake in step 2 can never be
  // confused with a leftover mistake in step 1, because step 1 is already
  // locked in as correct by the time step 2 becomes visible at all.
  let step1Done = false;
  let step2Done = false;
  let step1WrongAttempt = false;
  let step2WrongAttempt = false;

  function newProblem() {
    current = pickProblem();
    const multi = isMultiStep();

    problemText.textContent = current.text;
    step1Label.textContent = multi ? 'Steg 1: vilket räknesätt?' : 'Vilket räknesätt passar?';
    step2Block.style.display = 'none';

    [opRow1, opRow2].forEach(row => row.querySelectorAll('button').forEach(b => b.classList.remove('active')));
    [opFeedback1, opFeedback2].forEach(f => { f.textContent = ''; f.className = 'op-feedback'; });
    [calcRow1, calcRow2].forEach(r => r.style.display = 'none');
    [box_a1, box_b1, box_result1, box_a2, box_b2, box_result2].forEach(b => b.value = '');
    calcOp1.textContent = '';
    calcOp2.textContent = '';

    step1Done = false;
    step2Done = false;
    step1WrongAttempt = false;
    step2WrongAttempt = false;

    answerUnit.textContent = current.unit ? 'Svaret ska vara i ' + current.unit + '.' : '';
    feedback.innerHTML = '';
    problemBox.classList.remove('flash-correct', 'flash-wrong');
    awaitingNext = false;
    opRow1.querySelector('button').focus();
  }

  // Immediate feedback the instant a räknesätt button is clicked. Wrong
  // choices get a warning and can be retried; a correct choice reveals
  // that step's number-box template. Step 2's op buttons only appear once
  // step 1's boxes are verified correct in checkAnswer() below — not here.
  function wireOpRow(rowEl, feedbackEl, calcRowEl, calcOpEl, getExpectedOp) {
    rowEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-op]');
      if (!btn) return;
      rowEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      const expected = getExpectedOp();
      const correct = btn.dataset.op === expected;
      feedbackEl.textContent = correct ? 'Rätt!' : 'Fel, försök igen.';
      feedbackEl.className = 'op-feedback ' + (correct ? 'correct' : 'wrong');
      if (correct) {
        calcOpEl.textContent = expected;
        calcRowEl.style.display = 'flex';
        calcRowEl.querySelector('.box-input').focus();
      }
    });
  }
  wireOpRow(opRow1, opFeedback1, calcRow1, calcOp1, () => isMultiStep() ? current.ops[0] : current.op);
  wireOpRow(opRow2, opFeedback2, calcRow2, calcOp2, () => current.ops[1]);

  function readNum(input) {
    const n = parseFloat(input.value.trim().replace(/\s+/g, '').replace(',', '.'));
    return Number.isFinite(n) ? n : null;
  }
  function close(x, y) {
    return x !== null && y !== null && Math.abs(x - y) < 0.005;
  }
  // Commutative ops accept either box order; +/× results always check both.
  function operandsOk(typedA, typedB, groundA, groundB, op) {
    if (COMMUTATIVE[op]) {
      return (close(typedA, groundA) && close(typedB, groundB)) || (close(typedA, groundB) && close(typedB, groundA));
    }
    return close(typedA, groundA) && close(typedB, groundB);
  }

  // Some steps combine two quantities that were originally stated in
  // different units (e.g. "1,8 kg" and "350 g"). There are always two
  // equally valid ways to reconcile that: convert the first into the
  // second's unit, or vice versa — both give a correct, self-consistent
  // set of numbers, just scaled by the same metric factor throughout.
  // A problem that has this ambiguity carries an optional `alt1`/`alt2`
  // field: `{ a, b, r }`, the same triple as the primary a/b/result but
  // expressed via the other conversion direction. Every step is checked
  // against the primary triple OR (if present) the alt triple — never a
  // mix of the two — so a fully self-consistent alternate path is always
  // accepted, and only that path.
  function stepCandidates(groundA, groundB, groundR, alt) {
    const list = [{ a: groundA, b: groundB, r: groundR }];
    if (alt) list.push(alt);
    return list;
  }
  function evalStep(typedA, typedB, typedR, op, candidates) {
    let operandsGood = false;
    let fullGood = false;
    for (const c of candidates) {
      if (operandsOk(typedA, typedB, c.a, c.b, op)) {
        operandsGood = true;
        if (close(typedR, c.r)) { fullGood = true; break; }
      }
    }
    return { operandsGood, fullGood };
  }

  function flashBox(ok) {
    problemBox.classList.remove('flash-correct', 'flash-wrong');
    void problemBox.offsetWidth;
    problemBox.classList.add(ok ? 'flash-correct' : 'flash-wrong');
  }
  // Clears any leftover red from an earlier wrong attempt without marking
  // the box green — used when an intermediate step (not the whole problem)
  // is confirmed correct.
  function clearFlash() {
    problemBox.classList.remove('flash-correct', 'flash-wrong');
  }

  function renderFeedback(extraLine) {
    let lines = step1Done ? '<div class="feedback-line correct">Steg 1: Rätt!</div>' : '';
    if (isMultiStep() && step2Done) {
      lines += '<div class="feedback-line correct">Steg 2: Rätt!</div>';
    }
    lines += extraLine || '';
    const done = isMultiStep() ? step2Done : step1Done;
    const noteLine = done && current.note ? '<div class="feedback-note">' + current.note + '</div>' : '';
    feedback.innerHTML = lines + noteLine;
  }

  function checkAnswer() {
    if (awaitingNext) {
      newProblem();
      return;
    }
    const multi = isMultiStep();

    if (!step1Done) {
      if (calcRow1.style.display === 'none') return;
      if ([box_a1, box_b1, box_result1].some(b => b.value.trim() === '')) return;

      const op1 = multi ? current.ops[0] : current.op;
      const a1 = readNum(box_a1), b1 = readNum(box_b1), r1 = readNum(box_result1);
      const candidates1 = stepCandidates(current.a1, current.b1, multi ? current.mid : current.answer, current.alt1);
      const { operandsGood, fullGood } = evalStep(a1, b1, r1, op1, candidates1);

      if (fullGood) {
        step1Done = true;
        if (multi) {
          // Only step 1 of several is done — don't mark the whole problem
          // green yet, or it reads as "finished" before it is. Still clear
          // any red left over from an earlier wrong attempt on this step.
          clearFlash();
          renderFeedback();
          step2Block.style.display = 'block';
          opRow2.querySelector('button').focus();
        } else {
          flashBox(true);
          totalCount++;
          correctCount += step1WrongAttempt ? 0 : 1;
          scoreCorrect.textContent = correctCount;
          scoreTotal.textContent = totalCount;
          renderFeedback();
          awaitingNext = true;
        }
      } else {
        step1WrongAttempt = true;
        flashBox(false);
        const line = !operandsGood
          ? '<div class="feedback-line wrong">Steg 1: talen i rutorna stämmer inte med uppgiften. Läs texten igen.</div>'
          : '<div class="feedback-line wrong">Steg 1: talen stämmer, men uträkningen (resultatet) gör det inte. Räkna igen.</div>';
        renderFeedback(line);
      }
      return;
    }

    // Step 1 is locked in as correct — grade step 2.
    if (calcRow2.style.display === 'none') return;
    if ([box_a2, box_b2, box_result2].some(b => b.value.trim() === '')) return;

    const op2 = current.ops[1];
    const a2 = readNum(box_a2), b2 = readNum(box_b2), r2 = readNum(box_result2);
    const candidates2 = stepCandidates(current.a2, current.b2, current.answer, current.alt2);
    const { operandsGood, fullGood } = evalStep(a2, b2, r2, op2, candidates2);

    if (fullGood) {
      step2Done = true;
      flashBox(true);
      totalCount++;
      correctCount += (step1WrongAttempt || step2WrongAttempt) ? 0 : 1;
      scoreCorrect.textContent = correctCount;
      scoreTotal.textContent = totalCount;
      renderFeedback();
      awaitingNext = true;
    } else {
      step2WrongAttempt = true;
      flashBox(false);
      const line = !operandsGood
        ? '<div class="feedback-line wrong">Steg 2: talen i rutorna stämmer inte med uppgiften. Läs texten igen.</div>'
        : '<div class="feedback-line wrong">Steg 2: talen stämmer, men uträkningen (resultatet, svaret) gör det inte. Räkna igen.</div>';
      renderFeedback(line);
    }
  }

  categoryRow.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-cat]');
    if (!btn) return;
    currentCategory = btn.dataset.cat;
    categoryRow.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    newProblem();
  });

  checkBtn.addEventListener('click', checkAnswer);
  nextBtn.addEventListener('click', newProblem);

  [box_a1, box_b1, box_result1, box_a2, box_b2, box_result2].forEach(input => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.repeat) {
        e.preventDefault();
        checkAnswer();
      }
    });
  });

  newProblem();
})();
</script>
